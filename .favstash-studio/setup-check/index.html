<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AI Simplified Lab — Smoke Test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
      }
      .composition-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(circle at 50% 35%, #1e1b4b 0%, #0b0f19 75%);
        overflow: hidden;
      }
      .clip {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 120px 80px;
        text-align: center;
      }
      /* Safe margin indicators & aesthetic grid background */
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(99, 102, 241, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }
      .glow-orb {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(129, 140, 248, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
        filter: blur(40px);
        pointer-events: none;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 28px;
        border-radius: 9999px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(165, 180, 252, 0.3);
        color: #c7d2fe;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 48px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .badge-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
      }
      .title {
        font-size: 68px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 32px;
        max-width: 900px;
      }
      .accent-text {
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card {
        width: 100%;
        max-width: 860px;
        padding: 44px 40px;
        margin-top: 40px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .card-label {
        font-size: 22px;
        font-weight: 600;
        color: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 16px;
      }
      .card-desc {
        font-size: 34px;
        font-weight: 500;
        color: #e2e8f0;
        line-height: 1.35;
      }
      /* Animated progress / energy bar */
      .meter-track {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        margin-top: 36px;
        overflow: hidden;
      }
      .meter-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div
      class="composition-root"
      data-composition-id="smoke-test"
      data-width="1080"
      data-height="1920"
      data-duration="3"
    >
      <div class="grid-pattern"></div>
      <div id="orb" class="glow-orb" style="top: 25%; left: 28%;"></div>

      <div id="scene-root" class="clip" data-start="0" data-duration="3">
        <div id="badge" class="badge">
          <div class="badge-dot"></div>
          AI Simplified Lab
        </div>
        
        <h1 id="headline" class="title">
          Zero-Cost <span class="accent-text">AI Shorts</span> Pipeline
        </h1>

        <div id="card" class="card">
          <div class="card-label">Verification Phase 1</div>
          <p class="card-desc">HyperFrames + FFmpeg Rendering Engine Operational</p>
          <div class="meter-track">
            <div id="progress-bar" class="meter-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Clean, purposeful animation sequence over 3.0 seconds
      tl.from("#badge", { opacity: 0, y: -30, scale: 0.9, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.from("#headline", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.from("#card", { opacity: 0, y: 50, scale: 0.95, duration: 0.7, ease: "back.out(1.2)" }, 0.5);
      tl.to("#progress-bar", { width: "100%", duration: 1.8, ease: "power1.inOut" }, 0.7);
      tl.to("#orb", { scale: 1.25, opacity: 0.8, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.2);

      // Subtle pulse on card at the 2.2s mark
      tl.to("#card", { scale: 1.02, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out" }, 2.2);

      window.__timelines["smoke-test"] = tl;
    </script>
  </body>
</html>

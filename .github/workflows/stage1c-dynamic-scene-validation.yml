name: Stage 1C Dynamic Video Factory Validation

on:
  push:
    branches:
      - stage1c/dynamic-scene-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-scene-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run offline Node test suite
        run: node --test tests/*.test.mjs

      - name: Validate directed dynamic-scene example
        run: node pipeline/validate-dynamic-scene.mjs examples/dynamic-scene-plan.example.json
